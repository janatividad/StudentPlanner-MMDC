<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Student Planner MMDC</title>
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --canvas: #FFFFFF;
      --surface: #F7F8FA;
      --hover: #F1F3F7;
      --text: #1B2430;
      --muted: #6B7280;
      --accent: #1D4ED8;
      --accent-text: #FFFFFF;
      --border: #E3E7EE;
      --input: #64748B;
      --g: #4B5563;
      --gbg: #EEF0F4;
      --b: #1E40AF;
      --bbg: #DBEAFE;
      --ok: #166534;
      --okbg: #DCFCE7;
      --od: #991B1B;
      --odbg: #FEE2E2;
      --soon: #92400E;
      --soonbg: #FEF3C7;
      color-scheme: light
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --canvas: #191919;
        --surface: #202020;
        --hover: #262626;
        --text: #E8E8E8;
        --muted: #9B9B9B;
        --accent: #6B93FF;
        --accent-text: #0B1220;
        --border: #333;
        --input: #8A94A6;
        --g: #B8B8B8;
        --gbg: #333;
        --b: #93B4FF;
        --bbg: #1E2F57;
        --ok: #86EFAC;
        --okbg: #14391F;
        --od: #FCA5A5;
        --odbg: #4A1D1D;
        --soon: #FCD34D;
        --soonbg: #433512;
        color-scheme: dark
      }
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--canvas);
      color: var(--text);
      font: 16px/24px Inter, system-ui, -apple-system, "Segoe UI", sans-serif
    }

    #shell {
      display: flex;
      align-items: flex-start;
      min-height: 100%
    }

    aside {
      width: 260px;
      flex: none;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 12px 8px 24px;
      position: sticky;
      top: 0;
      height: 100dvh;
      overflow: auto
    }

    aside[hidden] {
      display: none
    }

    .si {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 8px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis
    }

    .si:hover {
      background: var(--hover)
    }

    .si[aria-current=page] {
      background: var(--gbg);
      font-weight: 600
    }

    .sh {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em
    }

    .sh button {
      min-height: 28px;
      min-width: 28px;
      padding: 0;
      justify-content: center;
      border: 0;
      color: var(--muted)
    }

    .st {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px
    }

    button.si {
      width: 100%;
      border: 0;
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      color: var(--text);
      padding: 0 8px;
      text-align: left
    }

    button.si:hover {
      background: var(--hover)
    }

    .pr {
      position: relative
    }

    .pr .si {
      padding-right: 36px
    }

    .pr .dots {
      position: absolute;
      right: 2px;
      top: 4px;
      min-height: 28px;
      min-width: 28px;
      padding: 0;
      justify-content: center;
      border: 0;
      background: transparent;
      color: var(--muted);
      opacity: 0
    }

    .pr:hover .dots,
    .pr:focus-within .dots,
    .pr .dots[aria-expanded=true] {
      opacity: 1
    }

    @media(hover:none) {
      .pr .dots {
        opacity: 1
      }
    }

    .menu {
      position: absolute;
      right: 4px;
      top: 34px;
      z-index: 30;
      background: var(--canvas);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
      min-width: 190px;
      box-shadow: 0 2px 6px rgba(27, 36, 48, .25)
    }

    .dg {
      color: var(--od) !important
    }

    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px
    }

    .dlg {
      background: var(--canvas);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 2px 6px rgba(27, 36, 48, .25)
    }

    button.danger {
      background: var(--odbg);
      color: var(--od);
      border-color: var(--od)
    }

    main {
      flex: 1;
      min-width: 0;
      max-width: 1040px;
      margin: 0 auto;
      padding: 8px 16px 64px
    }

    .top {
      display: flex;
      align-items: center;
      min-height: 44px;
      margin-bottom: 8px
    }

    @media(max-width:720px) {
      aside {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 20;
        height: auto;
        padding-top: calc(12px + env(safe-area-inset-top, 0px));
        box-shadow: 0 2px 6px rgba(27, 36, 48, .25);
        width: 280px
      }

      .si {
        min-height: 44px
      }
    }

    h1 {
      font-size: 28px;
      line-height: 36px;
      margin: 0
    }

    h2 {
      font-size: 20px;
      line-height: 28px;
      margin: 32px 0 8px
    }

    .meta {
      font-size: 14px;
      line-height: 20px;
      color: var(--muted)
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap
    }

    .sp {
      justify-content: space-between
    }

    a {
      color: inherit;
      text-decoration-color: var(--border);
      text-underline-offset: 3px
    }

    a:hover {
      text-decoration-color: currentColor
    }

    a.l {
      color: var(--accent)
    }

    button,
    .btn {
      min-height: 44px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--canvas);
      color: var(--text);
      font: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none
    }

    button:hover {
      background: var(--hover)
    }

    button.primary {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent)
    }

    button.ghost {
      border-color: transparent;
      color: var(--muted)
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px
    }

    input,
    select,
    textarea {
      font: inherit;
      color: var(--text);
      background: var(--canvas);
      border: 1px solid var(--input);
      border-radius: 8px;
      min-height: 44px;
      padding: 8px 12px;
      width: 100%
    }

    label {
      display: block;
      font-weight: 600;
      margin: 16px 0 4px
    }

    label small {
      font-weight: 400;
      color: var(--muted)
    }

    .err {
      color: var(--od);
      font-size: 14px;
      margin-top: 4px
    }

    .wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 640px;
      font-size: 14px;
      line-height: 20px
    }

    th {
      text-align: left;
      font-weight: 500;
      color: var(--muted);
      background: var(--surface);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap
    }

    td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle
    }

    tr:last-child td {
      border-bottom: 0
    }

    tbody tr:hover {
      background: var(--hover)
    }

    td.n {
      font-weight: 600;
      min-width: 180px;
      overflow-wrap: anywhere
    }

    td.c {
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .add {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-top: 1px solid var(--border);
      border-radius: 0;
      color: var(--muted);
      min-height: 44px
    }

    .pill,
    select.pill {
      display: inline-block;
      width: auto;
      min-height: 28px;
      padding: 0 10px;
      border: 0;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      appearance: auto
    }

    .ns {
      background: var(--gbg);
      color: var(--g)
    }

    .ip {
      background: var(--bbg);
      color: var(--b)
    }

    .dn {
      background: var(--okbg);
      color: var(--ok)
    }

    .tag {
      display: inline-block;
      font-size: 12px;
      padding: 0 6px;
      border-radius: 4px;
      font-weight: 600;
      margin-left: 6px
    }

    .od {
      background: var(--odbg);
      color: var(--od)
    }

    .soon {
      background: var(--soonbg);
      color: var(--soon)
    }

    .bar {
      display: inline-block;
      width: 72px;
      height: 6px;
      background: var(--gbg);
      border-radius: 3px;
      overflow: hidden;
      vertical-align: middle;
      margin-right: 6px
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--accent)
    }

    .tabs button {
      min-height: 36px;
      border-radius: 6px;
      font-size: 14px
    }

    .tabs button[aria-pressed=true] {
      background: var(--gbg);
      font-weight: 600
    }

    .title {
      font-size: 28px;
      line-height: 36px;
      font-weight: 700;
      border: 0;
      padding: 0;
      min-height: 44px;
      background: transparent
    }

    .props {
      margin: 8px 0
    }

    .prow {
      display: grid;
      grid-template-columns: 24px 200px 1fr 40px;
      gap: 2px 8px;
      align-items: center;
      border-radius: 6px
    }

    .prow.over {
      box-shadow: 0 -2px 0 var(--accent)
    }

    .prow.overb {
      box-shadow: 0 2px 0 var(--accent)
    }

    .prow.drag {
      opacity: .4
    }

    .dh {
      cursor: grab;
      color: var(--muted);
      min-height: 36px;
      min-width: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      user-select: none;
      border-radius: 6px
    }

    .prow:hover .dh,
    .dh:focus-visible {
      opacity: 1
    }

    .dh:hover {
      background: var(--hover)
    }

    @media(hover:none) {
      .dh {
        opacity: 1
      }
    }

    .props>span.k {
      color: var(--muted);
      font-size: 14px;
      padding: 6px 8px
    }

    .props input,
    .props textarea,
    .props select.pill {
      border-color: transparent;
      background: transparent;
      padding: 6px 8px;
      min-height: 36px
    }

    .props input:hover,
    .props textarea:hover {
      background: var(--hover)
    }

    .props input:focus,
    .props textarea:focus {
      border-color: var(--input);
      background: var(--canvas)
    }

    .props input.pl {
      color: var(--muted);
      font-size: 14px;
      flex: 1;
      min-width: 0
    }

    .lw {
      position: relative;
      display: flex;
      align-items: center;
      gap: 2px
    }

    .ti {
      min-height: 32px;
      min-width: 32px;
      padding: 0;
      justify-content: center;
      border: 0;
      background: transparent;
      color: var(--muted);
      flex: none
    }

    .tmenu {
      position: absolute;
      left: 0;
      top: 38px;
      z-index: 25;
      background: var(--canvas);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
      width: 220px;
      max-height: 320px;
      overflow: auto;
      box-shadow: 0 2px 6px rgba(27, 36, 48, .25)
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      padding: 4px 0
    }

    .chip {
      display: inline-flex;
      align-items: center;
      border-radius: 6px;
      background: var(--gbg);
      color: var(--g);
      font-size: 14px
    }

    .chip.on {
      background: var(--bbg);
      color: var(--b)
    }

    .chip .cb,
    .chip .cx {
      min-height: 28px;
      border: 0;
      background: transparent;
      color: inherit;
      padding: 0 8px;
      font-size: 14px
    }

    .chip .cx {
      padding: 0 6px 0 0;
      opacity: .7
    }

    .props input.oi {
      width: 130px;
      min-height: 28px;
      padding: 2px 8px
    }

    .props .x {
      min-height: 36px;
      min-width: 36px;
      padding: 0;
      justify-content: center;
      border: 0;
      color: var(--muted)
    }

    .props input::placeholder,
    .props textarea::placeholder {
      color: var(--muted);
      opacity: .7
    }

    @media(max-width:560px) {
      .prow {
        grid-template-columns: 24px 1fr 40px
      }

      .prow .v {
        grid-column: 2/4
      }
    }

    .banner {
      padding: 12px;
      border-radius: 8px;
      background: var(--odbg);
      color: var(--od);
      margin: 12px 0
    }

    .ql a {
      display: inline-block;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin: 0 6px 6px 0;
      font-size: 14px
    }

    #live {
      position: absolute;
      left: -9999px
    }
  </style>
</head>

<body>
  <div id="shell">
    <aside id="side" aria-label="Sidebar"></aside>
    <main id="app"></main>
  </div>
  <div id="modal"></div>
  <div id="live" role="status" aria-live="polite"></div>
  <script>
    const TZ = 'Asia/Manila', KEY = 'study-planner-mmdc-v3';
    const ST = [['not_started', 'Not started', 'ns'], ['in_progress', 'In progress', 'ip'], ['done', 'Done', 'dn']];
    const stOf = v => ST.find(s => s[0] === v) || ST[0];
    const today = () => new Date().toLocaleDateString('en-CA', { timeZone: TZ });
    const addDays = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10) };
    const fmt = d => new Date(d + 'T00:00:00Z').toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric', year: 'numeric' });
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const okUrl = u => { try { const x = new URL(u); return x.protocol === 'http:' || x.protocol === 'https:' } catch { return false } };
    let pc = 0; const nid = () => 'p' + Date.now().toString(36) + (pc++);
    const DEF = [['Code', 'code'], ['Section', 'section'], ['Course description', 'description'], ['Credits', 'credits'], ['Course homepage', 'homepage'], ['Syllabus', 'syllabus'], ['Mentoring', 'mentoring'], ['Recording', 'recording'], ['Sync schedule', 'sync']];
    const guess = l => /homepage|syllabus|recording|link|url/i.test(l) ? 'url' : /credit/i.test(l) ? 'number' : 'text';
    const TYPES = [['text', 'Text', '≡'], ['number', 'Number', '#'], ['select', 'Select', '◉'], ['multi', 'Multi-select', '☰'], ['status', 'Status', '◌'], ['date', 'Date', '📅'], ['checkbox', 'Checkbox', '☑'], ['url', 'URL', '🔗'], ['email', 'Email', '@'], ['phone', 'Phone', '📞']];
    const typeOf = t => TYPES.find(x => x[0] === t) || TYPES[0];
    const blank = (id, name) => ({ id, name, status: 'not_started', notes: '', props: DEF.map(([l]) => ({ id: nid(), label: l, value: '', type: guess(l) })) });
    let S, saveFail = false;
    function load() {
      const rd = k => { try { return JSON.parse(localStorage.getItem(k)) } catch { return null } };
      let s = rd(KEY);
      if (!s || !s.subjects) {
        const o = rd('study-planner-mmdc-v2') || rd('study-planner-mmdc-v1');
        if (o && o.subjects) { s = { ...o, pages: [] }; s.assignments = (o.assignments || []).map(a => ({ description: '', coursera_url: '', ...a, status: a.status === 'completed' ? 'done' : a.status === 'pending' ? 'not_started' : a.status })) }
        else s = { term: '2026–2027 Term 2', next: 10, subjects: ['Cloud Computing', 'Mobile Development Application (Backend)', 'System Integration and Architecture', 'Integrative Programming and Technologies'].map((n, i) => blank(i + 1, n)), assignments: [], links: [], pages: [] }
      }
      s.subjects.forEach(x => { if (!x.props) x.props = DEF.map(([l, f]) => ({ id: nid(), label: l, value: x[f] || '' })); x.status = stOf(x.status)[0]; x.props.forEach(p => { if (!p.type) p.type = guess(p.label) }) });
      s.pages = s.pages || []; s.links = s.links || []; if (!s.projects) { s.projects = [{ id: 9, name: s.term || '2026–2027 Term 2', icon: '📚' }]; if (!(s.next > 9)) s.next = 10 } s.subjects.forEach(x => { if (!x.project_id) x.project_id = s.projects[0].id });
      if (innerWidth < 720) s.side = false; else if (s.side === undefined) s.side = true;
      return s
    }
    S = load();
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); saveFail = false } catch { saveFail = true } };
    const say = m => document.getElementById('live').textContent = m;
    let from = '', draft = null, errs = {}, tab = 'upcoming', arm = '', focusP = '', menu = '', confirmId = '', tmenu = '', focusO = '';
    const app = document.getElementById('app'), side = document.getElementById('side');
    const sub = id => S.subjects.find(s => s.id == id);
    const cmp = (a, b) => a.due_date < b.due_date ? -1 : a.due_date > b.due_date ? 1 : a.id - b.id;
    const open = a => a.status !== 'done';
    const pill = (ent, id, f, v) => { const [, , c] = stOf(v); return `<select class="pill ${c}" data-ent="${ent}" data-id="${id}" data-f="${f}" aria-label="Status">${ST.map(s => `<option value="${s[0]}"${s[0] === v ? ' selected' : ''}>${s[1]}</option>`).join('')}</select>` };
    const lk = (u, t) => u ? `<a class="l" href="${esc(u)}" target="_blank" rel="noopener">${t}</a>` : '<span class="meta">—</span>';
    function prog(id) {
      const l = S.assignments.filter(a => a.subject_id == id), d = l.filter(a => a.status === 'done').length;
      return l.length ? `<span class="bar"><i style="width:${Math.round(d / l.length * 100)}%"></i></span>${d}/${l.length} · ${Math.round(d / l.length * 100)}%` : '<span class="meta">No assignments yet.</span>'
    }
    const tag = (a, t) => { if (!open(a)) return ''; return a.due_date < t ? '<span class="tag od">Overdue</span>' : a.due_date <= addDays(t, 6) ? '<span class="tag soon">Due soon</span>' : '' };
    const labels = (list = S.subjects) => { const seen = []; list.forEach(s => s.props.forEach(p => { const l = p.label.trim(); if (l && !seen.some(x => x.toLowerCase() === l.toLowerCase())) seen.push(l) })); return seen };
    const pp = (s, l) => s.props.find(p => p.label.trim().toLowerCase() === l.toLowerCase());
    const pv = (s, l) => { const p = pp(s, l); return p ? p.value : '' };
    const disp = p => {
      if (!p) return ''; const t = p.type || 'text', v = p.value;
      if (t === 'checkbox') return v === true ? '✓' : '';
      if (t === 'multi') return (v || []).map(x => `<span class="pill ns">${esc(x)}</span>`).join(' ');
      if (t === 'select' || t === 'status') return v ? `<span class="pill ${t === 'status' && v === 'Done' ? 'dn' : t === 'status' && v === 'In progress' ? 'ip' : 'ns'}">${esc(v)}</span>` : '';
      if (t === 'date') return v ? fmt(v) : '';
      return okUrl(v) ? lk(v, 'Open') : esc(v)
    };
    const typeBtn = (s, p) => `<button class="ti" data-act="ptype" data-id="${s.id}" data-pid="${p.id}" aria-haspopup="menu" aria-expanded="${tmenu === p.id}" aria-label="Property type: ${typeOf(p.type)[1]}. Change type" title="${typeOf(p.type)[1]}">${typeOf(p.type)[2]}</button>`;
    const typeMenu = (s, p) => `<div class="tmenu" role="menu">${TYPES.map(([k, l, i]) => `<button class="si" role="menuitemradio" aria-checked="${(p.type || 'text') === k}" data-act="settype" data-id="${s.id}" data-pid="${p.id}" data-t="${k}"><span style="width:20px;text-align:center">${i}</span> ${l}<span style="margin-left:auto">${(p.type || 'text') === k ? '✓' : ''}</span></button>`).join('')}</div>`;
    const valEd = (s, p) => {
      const t = p.type || 'text', a = `data-ent="prop" data-id="${s.id}" data-pid="${p.id}" data-k="value"`, ph = p.label.trim() ? 'Add ' + esc(p.label.toLowerCase()) : 'Add a value';
      if (t === 'checkbox') return `<input type="checkbox" ${a} ${p.value === true ? 'checked' : ''} style="width:20px;min-height:20px;margin:8px" aria-label="${esc(p.label) || 'Checkbox'}">`;
      if (t === 'select' || t === 'multi' || t === 'status') {

        S.links.push({ id: S.next++, label: v.label.trim(), url: v.url }); save(); render()
      }
    });
    let dragId = '';
    const reorder = (s, a, b, after) => { if (a === b) return; const i = s.props.findIndex(p => p.id === a); if (i < 0) return; const [m] = s.props.splice(i, 1); let j = s.props.findIndex(p => p.id === b); if (j < 0) j = s.props.length; s.props.splice(after ? j + 1 : j, 0, m); save() };
    const clr = () => document.querySelectorAll('.prow.over,.prow.overb,.prow.drag').forEach(r => r.classList.remove('over', 'overb', 'drag'));
    document.addEventListener('dragstart', e => { const h = e.target.closest && e.target.closest('[data-drag]'); if (!h) return; const row = h.closest('.prow'); dragId = row.dataset.prow; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); try { e.dataTransfer.setDragImage(row, 10, 10) } catch { } row.classList.add('drag') });
    document.addEventListener('dragover', e => { const row = e.target.closest && e.target.closest('.prow'); if (!dragId || !row) return; e.preventDefault(); const after = e.clientY > row.getBoundingClientRect().top + row.offsetHeight / 2; document.querySelectorAll('.prow.over,.prow.overb').forEach(r => r.classList.remove('over', 'overb')); if (row.dataset.prow !== dragId) row.classList.add(after ? 'overb' : 'over') });
    document.addEventListener('drop', e => { const row = e.target.closest && e.target.closest('.prow'); if (!dragId || !row) return; e.preventDefault(); const s = sub(row.dataset.sid), after = e.clientY > row.getBoundingClientRect().top + row.offsetHeight / 2; reorder(s, dragId, row.dataset.prow, after); dragId = ''; render(); say('Property moved.') });
    document.addEventListener('dragend', () => { dragId = ''; clr() });
    addEventListener('keydown', e => { const h = e.target.closest && e.target.closest('[data-drag]'); if (!h || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return; e.preventDefault(); const row = h.closest('.prow'), s = sub(row.dataset.sid), i = s.props.findIndex(p => p.id === row.dataset.prow), j = i + (e.key === 'ArrowUp' ? -1 : 1); if (j < 0 || j >= s.props.length) return; const [m] = s.props.splice(i, 1); s.props.splice(j, 0, m); save(); render(); const nh = app.querySelector(`[data-prow="${m.id}"] .dh`); if (nh) nh.focus(); say('Moved property to position ' + (j + 1)) });
    addEventListener('keydown', e => {
      const el = e.target; if (e.key === 'Enter' && el.dataset && el.dataset.ent === 'optadd') { e.preventDefault(); const s = sub(el.dataset.id), p = s && s.props.find(x => x.id === el.dataset.pid), v = el.value.trim(); if (p && v && !(p.options || []).includes(v)) { (p.options = p.options || []).push(v); save(); focusO = p.id; render() } }
      if (e.key === 'Escape' && tmenu) { tmenu = ''; render() }
    });
    addEventListener('keydown', e => { if (e.key === 'Escape' && (menu || confirmId)) { menu = ''; confirmId = ''; renderSide(); renderModal() } });
    addEventListener('hashchange', () => { window.scrollTo(0, 0); arm = ''; menu = ''; render() });
    render();
  </script>
